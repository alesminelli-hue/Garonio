# Costruisce l'APK Android di GT Tractor (app-android/) e lo pubblica nella release «android».
# Link fisso per scaricarlo: https://github.com/alesminelli-hue/Garonio/releases/download/android/GT-Tractor.apk
name: APK Android

on:
  push:
    branches: [claude/project-thread-3w5r7e, claude/project-thread-iif3yf]
    paths-ignore: ['**.md', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # l'Android SDK è già installato sul runner (ANDROID_HOME)
      - name: Prepara il progetto Android
        run: ./app-android/prepara.sh ${{ github.run_number }} "1.0.${{ github.run_number }}"

      - name: Compila
        working-directory: app-android/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Firma
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=app-android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" allineato.apk
          "$BT/apksigner" sign --ks app-android/gt-tractor.keystore --ks-key-alias gttractor \
            --ks-pass pass:gttractor-app --key-pass pass:gttractor-app --out GT-Tractor.apk allineato.apk
          "$BT/apksigner" verify GT-Tractor.apk
          ls -la GT-Tractor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GT-Tractor-apk
          path: GT-Tractor.apk

      - name: Pubblica nella release «android»
        if: github.ref == 'refs/heads/claude/project-thread-3w5r7e'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Versione 1.0.${{ github.run_number }} · $(date -u +%Y-%m-%d). Scarica GT-Tractor.apk sul telefono Android e aprilo per installarlo o aggiornarlo (i salvataggi restano)."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android GT-Tractor.apk --clobber
            gh release edit android --notes "$NOTE" --title "GT Tractor per Android"
          else
            gh release create android GT-Tractor.apk --title "GT Tractor per Android" --notes "$NOTE" --target "${{ github.sha }}"
          fi
